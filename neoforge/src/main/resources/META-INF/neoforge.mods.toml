modLoader = "javafml"
loaderVersion = "[2,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "lowrenderdistance"
version = "${version}"
displayName = "LowRenderDistance"
authors = "Gahaha"
description = '''
Lets you set render distance and simulation distance as low as 1 chunk, in both the vanilla video settings and Sodium's. Client-side only.
'''
logoFile = "assets/lowrenderdistance/icon.png"
logoBlur = false

[[dependencies.lowrenderdistance]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range_neoforge}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "lowrenderdistance.mixins.json"

[[mixins]]
config = "lowrenderdistance.sodium.mixins.json"
requiredMods = ["sodium"]
