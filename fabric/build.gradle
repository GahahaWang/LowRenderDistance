apply plugin: 'multiloader-loader'
apply plugin: 'net.fabricmc.fabric-loom'

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "maven.modrinth:sodium:${sodium_version}-fabric"
    implementation "maven.modrinth:bobby:${bobby_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version_range_fabric', rootProject.minecraft_version_range_fabric
    inputs.property 'fabric_loader_version', rootProject.fabric_loader_version

    filesMatching('fabric.mod.json') {
        expand([
            'version': project.version,
            'minecraft_version_range_fabric': rootProject.minecraft_version_range_fabric,
            'fabric_loader_version': rootProject.fabric_loader_version
        ])
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}