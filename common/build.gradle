apply plugin: 'multiloader-common'
apply plugin: 'net.fabricmc.fabric-loom'

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    implementation "maven.modrinth:sodium:${sodium_version}-fabric"
    compileOnly('net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7')
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.5'))
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}